[project]
name = "cando"
version = "0.1.0"
description = "Code repository of the CANDO project for autonomous generation of Layout Designs."
readme = "README.md"
license = { text = "MIT" }
requires-python =  ">=3.13.6,<3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Core orchestration -- upper-bounded to the next major version since
    # these move fast and a breaking change would silently affect the
    # paper's reported results on a fresh install. Exact versions used to
    # produce paper results are additionally pinned in uv.lock.
    "langchain[openai]>=1.4.2,<2.0.0",
    "langchain-community>=0.4.1,<0.5.0",
    "langchain-google-genai>=3.2.0,<5.0.0",
    "langchain-openai>=1.1.0,<2.0.0",
    "langgraph>=1.2.9,<2.0.0",
    "openai>=3.22.1,<4.0.0",
    "pydantic>=2.13.4,<3.0.0",
    # Geometry / data / ML
    "geopandas>=1.1.1",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyarrow>=22.0.0",
    "scikit-learn>=1.7.2",
    "scipy>=1.18.0",
    "shapely>=2.1.2",
    # Misc
    "python-dotenv>=1.2.1",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.3.0",
    "pytest-cov>=6.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
constraint-dependencies = ["websockets<16", "xxhash<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 78
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cando"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
