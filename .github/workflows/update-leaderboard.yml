name: Update leaderboard

on:
  schedule:
    - cron: "30 */6 * * *"      # every 6 hours, at :30; GitHub may start scheduled runs late
  workflow_dispatch:
  push:
    paths:
      - docs/assets/data/leaderboard_config.json
      - .github/scripts/snapshot_leaderboard.py
      - .github/workflows/update-leaderboard.yml

permissions:
  contents: write

concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Snapshot the Codabench leaderboard
        env:
          CODABENCH_API_TOKEN: ${{ secrets.CODABENCH_API_TOKEN }}
        run: python3 .github/scripts/snapshot_leaderboard.py

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain -- docs/assets/data/leaderboard_snapshot.json)" ]; then
            echo "No changes."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/data/leaderboard_snapshot.json
          git commit -m "Update leaderboard snapshot"
          git push
