name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-build --no-install-project --extra dev

      - name: Run ruff check
        run: uv run --locked --no-build --no-sync ruff check .

      - name: Run ruff format check
        run: uv run --locked --no-build --no-sync ruff format --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-build --no-install-project --extra dev

      - name: Run mypy
        run: uv run --locked --no-build --no-sync mypy src

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-build --no-install-project --extra dev

      - name: Run pytest
        # The project itself is not installed (--no-build), so import it from src.
        env:
          PYTHONPATH: src
        run: uv run --locked --no-build --no-sync pytest --cov=cando --cov-report=term-missing

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Export locked dependencies
        run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements-audit.txt

      - name: Audit dependencies
        run: uvx --no-build --python 3.13 pip-audit==2.10.1 -r requirements-audit.txt
